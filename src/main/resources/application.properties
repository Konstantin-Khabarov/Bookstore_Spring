spring.application.name=BookStore

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore?sslmode=disable
spring.datasource.username=bookstore
spring.datasource.password=bookstore

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# HikariCP — postgres по умолчанию закрывает idle-соединения раньше чем истекает max-lifetime
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

spring.sql.init.mode=always

server.port=8081

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
